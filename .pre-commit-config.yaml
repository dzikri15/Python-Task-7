# Pre-commit hooks untuk Tugas Python Pertemuan 7.
# Pasang dengan:  pre-commit install
# Jalankan manual ke seluruh repo dengan:  pre-commit run --all-files
repos:
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        language_version: python3.12
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=79]
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
